{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}

{% block content %}
<div class="card" style="max-width:520px;margin:60px auto">
  <div class="empty">
    <span class="mark">{{ code }}</span>
    <p>{{ msg }}</p>
    {% if ref %}
      <p class="small muted">{{ t('Reference') }} <span class="mono">{{ ref }}</span><br>
        <span class="faint">{{ t('The details are in instance/server.log on the computer running the CRM.') }}</span></p>
    {% endif %}
    <a class="btn btn-gold" href="{{ url_for('main.dashboard') }}">{{ t('Back to the dashboard') }}</a>
  </div>
</div>
{% endblock %}
