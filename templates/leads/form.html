{% extends "base.html" %}
{% block title %}{{ t('Edit lead') if l else t('Capture lead') }}{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <div class="eyebrow">03 · {{ t('Pipeline') }}</div>
    <h1 class="page-title">{{ t('Edit lead') if l else t('Capture a lead') }}</h1>
  </div>
</div>

<form method="post" class="card" style="max-width:820px">
  <div class="card-body">
    <div class="form-grid">
      <div class="field">
        <label for="full_name">{{ t('Full name') }}</label>
        <input id="full_name" type="text" name="full_name" required value="{{ l.full_name if l else '' }}">
      </div>
      <div class="field">
        <label for="phone">{{ t('Phone') }}</label>
        <input id="phone" type="tel" name="phone" value="{{ l.phone if l else '' }}" placeholder="+974 ...">
      </div>

      <div class="field">
        <label for="email">{{ t('Email') }}</label>
        <input id="email" type="email" name="email" value="{{ l.email if l else '' }}">
      </div>
      <div class="field">
        <label for="source">{{ t('Source') }}</label>
        <select id="source" name="source">
          {% for s in sources %}<option value="{{ s }}" {{ 'selected' if l and l.source == s }}>{{ t(s) }}</option>{% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="status">{{ t('Pipeline stage') }}</label>
        <select id="status" name="status">
          {% for s in stages %}<option value="{{ s }}" {{ 'selected' if l and l.status == s }}>{{ t(s) }}</option>{% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="budget">{{ t('Budget') }} ({{ currency }})</label>
        <input id="budget" type="number" name="budget" step="any" min="0" inputmode="decimal" value="{{ l.budget | round(2) if l and l.budget else '' }}">
      </div>

      <div class="field">
        <label for="agent_id">{{ t('Assigned agent') }}</label>
        <select id="agent_id" name="agent_id">
          <option value="">{{ t('Leave in the shared pool') }}</option>
          {% for a in agents %}
            <option value="{{ a.id }}" {{ 'selected' if l and l.agent_id == a.id }}>{{ a.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field span-2">
        <label for="property_id">{{ t('Property of interest') }}</label>
        <div style="display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap">
          <input type="text" id="property_search" style="flex:2; min-width:180px"
                 placeholder="{{ t('Search by name, ref or unit') }}" autocomplete="off">
          <select id="property_area_filter" style="flex:1; min-width:140px">
            <option value="">{{ t('Any location') }}</option>
            {% for a in prop_areas %}<option value="{{ a }}">{{ a }}</option>{% endfor %}
          </select>
          <select id="property_beds_filter" style="flex:1; min-width:120px">
            <option value="">{{ t('Any bedrooms') }}</option>
            {% for b in prop_bedrooms %}
              <option value="{{ b }}">{{ t('Studio') if b == 0 else b }}</option>
            {% endfor %}
          </select>
        </div>
        <select id="property_id" name="property_id" size="8">
          <option value="">{{ t('Not decided yet') }}</option>
          {% for p in props %}
            <option value="{{ p.id }}"
                    data-search="{{ (p.ref ~ ' ' ~ p.title ~ ' ' ~ (p.area or '')) | lower }}"
                    data-area="{{ p.area or '' }}"
                    data-beds="{{ p.bedrooms if p.bedrooms is not none else '' }}"
                    {{ 'selected' if l and l.property_id == p.id }}>
              {{ p.ref }} — {{ p.title }}{% if p.area %} · {{ p.area }}{% endif %}</option>
          {% endfor %}
        </select>
        <span class="small faint" id="property_count"></span>
      </div>

      <div class="field">
        <label for="next_follow_up">{{ t('Next follow-up') }}</label>
        <input id="next_follow_up" type="datetime-local" name="next_follow_up"
               value="{{ l.next_follow_up | local_input if l else '' }}">
      </div>
      <div class="field"></div>

      <div class="field span-2">
        <label for="notes">{{ t('Requirements and notes') }}</label>
        <textarea id="notes" name="notes"
          placeholder="What are they looking for? Area, size, move-in date, financing.">{{ l.notes if l else '' }}</textarea>
      </div>
    </div>
  </div>

  <div class="modal-foot">
    <a class="btn btn-quiet" href="{{ url_for('leads.detail', lid=l.id) if l else url_for('leads.board') }}">{{ t('Cancel') }}</a>
    <button class="btn btn-gold" type="submit">{{ t('Save lead') if l else t('Capture lead') }}</button>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script>
// Narrows the property list by free-text search, location and bedroom
// count instead of making the agent scroll every property to find one.
(function () {
  var search = document.getElementById('property_search');
  var areaFilter = document.getElementById('property_area_filter');
  var bedsFilter = document.getElementById('property_beds_filter');
  var select = document.getElementById('property_id');
  var count = document.getElementById('property_count');
  var options = Array.prototype.slice.call(select.options);
  var total = options.length - 1; // minus "Not decided yet"

  function apply() {
    var q = search.value.trim().toLowerCase();
    var area = areaFilter.value;
    var beds = bedsFilter.value;
    var shown = 0;
    options.forEach(function (opt) {
      if (!opt.value) { opt.hidden = false; return; } // always keep the blank option
      var show = (!q || opt.dataset.search.indexOf(q) !== -1)
        && (!area || opt.dataset.area === area)
        && (!beds || opt.dataset.beds === beds);
      opt.hidden = !show;
      if (show) shown++;
    });
    count.textContent = "{{ t('Showing') }} " + shown + " {{ t('of') }} " + total;
  }

  search.addEventListener('input', apply);
  areaFilter.addEventListener('change', apply);
  bedsFilter.addEventListener('change', apply);
  apply();
})();
</script>
{% endblock %}
